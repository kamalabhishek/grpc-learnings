grpc:
  server:
    port: 9000

spring:
  application:
    name: NETFLIX
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/grpc?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:grpclearnings}
    password: ${DB_PASSWORD:Welcome@123}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate.ddl-auto: none
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect
        default_storage_engine: innodb
